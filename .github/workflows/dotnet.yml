name: Build and Deploy .NET Application

on:
  push:
    branches:
      - main # Automáticamente se ejecuta cuando se suben cambios a la rama principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Lab10-JuniorSullca.sln

    - name: Build application
      run: dotnet build Lab10-JuniorSullca.sln --configuration Release --no-restore

    - name: Publish application
      run: dotnet publish Lab10-JuniorSullca.Api/Lab10-JuniorSullca.Api.csproj --configuration Release --output ./published

    - name: Upload published application
      uses: actions/upload-artifact@v4
      with:
        name: published-app
        path: ./published
